<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 450px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    select {
      background: white;
      cursor: pointer;
    }
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    button {
      padding: 8px 15px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }
    button:hover {
      background: #357ae8;
    }
    button.remove {
      background: #ea4335;
    }
    button.remove:hover {
      background: #d33828;
    }
    .site-item {
      padding: 8px;
      background: #f5f5f5;
      margin: 5px 0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .switch {
      position: relative;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4285f4;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }
    .file-input-label {
      display: block;
      padding: 8px;
      background: #f5f5f5;
      border: 2px dashed #ddd;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .file-input-label:hover {
      background: #e8e8e8;
      border-color: #4285f4;
    }
    .file-name {
      margin-top: 5px;
      font-size: 12px;
      color: #666;
      font-style: italic;
    }
    .preview-image {
      max-width: 100%;
      max-height: 150px;
      margin-top: 10px;
      border-radius: 4px;
      display: none;
    }
    .preview-image.show {
      display: block;
    }
  </style>
</head>
<body>
  <h2>⛔ Блокировщик сайтов</h2>
  
  <div class="section">
    <div class="toggle">
      <label class="switch">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>
      <span>Блокировка включена</span>
    </div>
  </div>

  <div class="section">
    <label>Добавить сайт для блокировки:</label>
    <input type="text" id="siteInput" placeholder="example.com">
    <button id="addSite" style="margin-top: 5px;">Добавить</button>
  </div>

  <div class="section">
    <label>Заблокированные сайты:</label>
    <div id="siteList"></div>
  </div>

  <hr>

  <h3>Настройки страницы блокировки</h3>

  <div class="section">
    <label>Текст сообщения:</label>
    <textarea id="blockMessage" placeholder="Этот сайт заблокирован"></textarea>
  </div>

  <div class="section">
    <label>Название вкладки:</label>
    <input type="text" id="pageTitle" placeholder="Сайт заблокирован">
  </div>

  <div class="section">
    <label>Шрифт текста:</label>
    <select id="fontFamily">
      <option value="'Segoe UI', Arial, sans-serif">Segoe UI</option>
      <option value="Arial, sans-serif">Arial</option>
      <option value="'Arial Black', sans-serif">Arial Black</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Palatino Linotype', serif">Palatino</option>
      <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
      <option value="Impact, fantasy">Impact</option>
      <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
      <option value="Verdana, sans-serif">Verdana</option>
      <option value="'Brush Script MT', cursive">Brush Script</option>
      <option value="'Lucida Console', monospace">Lucida Console</option>
      <option value="'Lucida Sans', sans-serif">Lucida Sans</option>
      <option value="Tahoma, sans-serif">Tahoma</option>
      <option value="'Century Gothic', sans-serif">Century Gothic</option>
      <option value="'Copperplate', fantasy">Copperplate</option>
      <option value="'Papyrus', fantasy">Papyrus</option>
      <option value="'Rockwell', serif">Rockwell</option>
      <option value="'Garamond', serif">Garamond</option>
      <option value="'Bookman', serif">Bookman</option>
      <option value="'Monaco', monospace">Monaco</option>
      <option value="'Consolas', monospace">Consolas</option>
      <option value="'Optima', sans-serif">Optima</option>
      <option value="'Didot', serif">Didot</option>
      <option value="'Bodoni MT', serif">Bodoni</option>
      <option value="'Cambria', serif">Cambria</option>
      <option value="'Calibri', sans-serif">Calibri</option>
      <option value="'Franklin Gothic', sans-serif">Franklin Gothic</option>
      <option value="'Gill Sans', sans-serif">Gill Sans</option>
    </select>
  </div>

  <div class="section">
    <label>Фоновое изображение:</label>
    <div class="file-input-wrapper">
      <input type="file" id="imageFile" accept="image/*">
      <label for="imageFile" class="file-input-label">
        📁 Выбрать изображение
      </label>
    </div>
    <div id="imageName" class="file-name"></div>
    <img id="imagePreview" class="preview-image">
  </div>

  <div class="section">
    <label>Фоновая музыка:</label>
    <div class="file-input-wrapper">
      <input type="file" id="audioFile" accept="audio/*">
      <label for="audioFile" class="file-input-label">
        🎵 Выбрать аудиофайл
      </label>
    </div>
    <div id="audioName" class="file-name"></div>
  </div>

  <button id="saveSettings">Сохранить настройки</button>

  <script src="popup.js"></script>
</body>
</html>
